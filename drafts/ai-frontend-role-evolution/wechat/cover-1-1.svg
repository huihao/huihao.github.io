<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="前端岗位的消失论，或许这次不是狼来了">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#161f36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#20c6f2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#20c6f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <rect width="900" height="900" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 96H900"/>
    <path d="M0 820H900"/>
  </g>

  <!-- 标题 -->
  <g font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <text x="450" y="214" font-size="24" fill="#20c6f2" letter-spacing="7">AI 时代 · 大厂一手材料</text>
    <text x="450" y="330" font-size="72" fill="#ffffff" stroke="#ffffff" stroke-width="2.6" letter-spacing="3">前端岗位的消失论</text>
    <text x="450" y="418" font-size="50" fill="#cfdcf0" stroke="#cfdcf0" stroke-width="1.2" letter-spacing="3">或许这次不是"狼来了"</text>
    <text x="450" y="492" font-size="24" fill="#8fa3c4" letter-spacing="4">活儿被谁接走 · 谁来验收 · 经验归谁</text>
  </g>

  <!-- 图形：一个整体被拆成三块，最后收敛成一枚环 -->
  <g>
    <rect x="250" y="560" width="180" height="96" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="276" y="588" width="128" height="11" rx="5.5"/>
      <rect x="276" y="612" width="88" height="11" rx="5.5"/>
      <rect x="276" y="636" width="56" height="11" rx="5.5"/>
    </g>

    <g stroke="#20c6f2" stroke-opacity="0.32" fill="none">
      <path d="M430 588C466 588 464 566 500 566"/>
      <path d="M430 608C466 608 464 608 500 608"/>
      <path d="M430 628C466 628 464 650 500 650"/>
    </g>

    <rect x="500" y="556" width="132" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="500" y="597" width="132" height="22" rx="11" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="500" y="638" width="132" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="500" y="597" width="52" height="22" rx="11" fill="#20c6f2" fill-opacity="0.55"/>

    <g fill="none" stroke="#20c6f2">
      <circle cx="724" cy="608" r="58" stroke-opacity="0.12"/>
      <circle cx="724" cy="608" r="40" stroke-opacity="0.22"/>
      <circle cx="724" cy="608" r="23" stroke-opacity="0.42"/>
      <circle cx="724" cy="608" r="7" fill="#20c6f2" fill-opacity="0.9" stroke="none"/>
    </g>
  </g>

  <text x="450" y="858" font-family="WenQuanYi Micro Hei, sans-serif" font-size="22" fill="#5f7395" text-anchor="middle" letter-spacing="3">bio.wuhh.cc</text>
</svg>
