<svg xmlns="http://www.w3.org/2000/svg" width="570" height="144" viewBox="0 0 570 144" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="570" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1020" />
      <stop offset="0.5" stop-color="#131a33" />
      <stop offset="1" stop-color="#1b1030" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1d2947" />
      <stop offset="1" stop-color="#0e1424" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7fe6ff" />
      <stop offset="1" stop-color="#a97bff" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#20c6f2" stop-opacity="0.5" />
      <stop offset="1" stop-color="#20c6f2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="570" height="144" rx="16" fill="url(#bg)" />
  <circle cx="470" cy="96" r="86" fill="url(#glow)" />

  <!-- memory chips -->
  <g opacity="0.85">
    <rect x="392" y="30" width="132" height="20" rx="5" fill="#243250" stroke="#3b4d75" stroke-width="1" />
    <g fill="#3b4d75">
      <rect x="400" y="36" width="12" height="8" rx="2" />
      <rect x="418" y="36" width="12" height="8" rx="2" />
      <rect x="436" y="36" width="12" height="8" rx="2" />
      <rect x="454" y="36" width="12" height="8" rx="2" />
      <rect x="472" y="36" width="12" height="8" rx="2" />
      <rect x="490" y="36" width="12" height="8" rx="2" />
      <rect x="508" y="36" width="10" height="8" rx="2" />
    </g>
    <rect x="392" y="58" width="132" height="20" rx="5" fill="#1d2740" stroke="#33456a" stroke-width="1" />
    <g fill="#33456a">
      <rect x="400" y="64" width="12" height="8" rx="2" />
      <rect x="418" y="64" width="12" height="8" rx="2" />
      <rect x="436" y="64" width="12" height="8" rx="2" />
      <rect x="454" y="64" width="12" height="8" rx="2" />
      <rect x="472" y="64" width="12" height="8" rx="2" />
      <rect x="490" y="64" width="12" height="8" rx="2" />
      <rect x="508" y="64" width="10" height="8" rx="2" />
    </g>
  </g>

  <!-- price tag dropping -->
  <g transform="translate(300 22)">
    <path d="M10 4 h30 l10 10 -30 30 -10 -10 Z" fill="#122038" stroke="url(#stroke)" stroke-width="1.6" stroke-linejoin="round" />
    <circle cx="20" cy="14" r="3.2" fill="#7fe6ff" />
    <path d="M44 40 l14 14" stroke="#7fe6ff" stroke-width="2.2" stroke-linecap="round" />
    <path d="M50 48 l6 6 M56 42 l6 6" stroke="#a97bff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- gpu board -->
  <g>
    <rect x="36" y="34" width="196" height="76" rx="12" fill="url(#chip)" stroke="url(#stroke)" stroke-width="2" />
    <rect x="52" y="50" width="66" height="44" rx="8" fill="#0d1526" stroke="#3f5b8a" stroke-width="1.4" />
    <rect x="64" y="62" width="42" height="20" rx="4" fill="#20c6f2" fill-opacity="0.22" stroke="#20c6f2" stroke-opacity="0.5" />
    <g fill="#2c3d63">
      <rect x="132" y="52" width="84" height="10" rx="5" />
      <rect x="132" y="68" width="70" height="10" rx="5" />
      <rect x="132" y="84" width="52" height="10" rx="5" />
    </g>
    <g fill="#7fe6ff" fill-opacity="0.9">
      <circle cx="212" cy="52" r="3" />
      <circle cx="212" cy="68" r="3" />
      <circle cx="212" cy="84" r="3" />
    </g>
  </g>

  <!-- gpu pcie pins -->
  <g stroke="#41598c" stroke-width="2" stroke-linecap="round">
    <path d="M60 114 v8" /><path d="M72 114 v8" /><path d="M84 114 v8" /><path d="M96 114 v8" />
    <path d="M108 114 v8" /><path d="M120 114 v8" /><path d="M132 114 v8" /><path d="M144 114 v8" />
    <path d="M156 114 v8" /><path d="M168 114 v8" /><path d="M180 114 v8" /><path d="M192 114 v8" />
    <path d="M204 114 v8" /><path d="M216 114 v8" />
  </g>

  <!-- falling price arrow -->
  <g stroke="url(#stroke)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M250 40 L268 62 L282 48 L306 86" />
    <path d="M292 86 h14 v-14" />
  </g>

  <!-- gauge arc -->
  <g opacity="0.5">
    <path d="M330 118 a44 44 0 0 1 88 0" stroke="#3c5a8f" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M330 118 a44 44 0 0 1 26 -38" stroke="#20c6f2" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <g opacity="0.85">
    <circle cx="536" cy="26" r="2.6" fill="#7fe6ff" />
    <circle cx="520" cy="44" r="2" fill="#a97bff" />
    <circle cx="544" cy="50" r="2.2" fill="#20c6f2" />
  </g>
</svg>
