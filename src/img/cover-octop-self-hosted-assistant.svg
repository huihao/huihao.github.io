      <stop stop-color="#0a1020" />
      <stop offset="0.5" stop-color="#131a33" />
      <stop offset="1" stop-color="#1b1030" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
