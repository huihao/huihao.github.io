{% comment %}
  目录：从正文里取出 h2 / h3，kramdown 已经给每个标题生成了 id。
  {% endcomment %}
{% assign toc_lines = page.content | replace: '<h2', '~<h2' | replace: '<h3', '~<h3' | split: '~' %}
{% assign toc_items = '' %}
{% for line in toc_lines %}
    {% assign level = line | slice: 2, 1 %}
    {% if level == '2' or level == '3' %}
        {% assign heading_id = line | split: 'id="' | slice: 1 | first | split: '"' | first %}
        {% assign heading_text = line | split: '>' | slice: 1 | first | remove: '</h2' | remove: '</h3' | strip_html | strip %}
        {% if heading_id != '' and heading_text != '' %}
            {% capture toc_items %}{{ toc_items }}<li class="toc-item toc-level-{{ level }}"><a href="#{{ heading_id }}">{{ heading_text }}</a></li>{% endcapture %}
        {% endif %}
    {% endif %}
{% endfor %}
{% if toc_items != '' %}
<nav class="toc" aria-label="文章目录" data-pagefind-ignore>
    <h2 class="toc-title">目录</h2>
    <ul class="toc-list">
        {{ toc_items }}
    </ul>
</nav>
{% endif %}
