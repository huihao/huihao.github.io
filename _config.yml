# Site settings
title: Kimi
email: wuhuihao@qq.com
description: huihao 的个人博客，记录 JavaScript、HTML 与 CSS 的实践笔记
lang: zh-CN
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://bio.wuhh.cc" # the base hostname & protocol for your site
twitter_username: wuhuihao
github_username:  huihao

# 作者信息（jekyll-feed 会写入 Atom feed 的 <author>）
author:
  name: Kimi
  email: wuhuihao@qq.com
  uri: https://bio.wuhh.cc

# Build settings
markdown: kramdown                                                           
kramdown:                                                                       
   input: GFM
   hard_wrap: false

# 分页
permalink: /:year/:month/:day/:title.html
paginate: 5
paginate_path: "article/:num"

# 代码高亮：Rouge（Jekyll 的默认高亮器，也随 GitHub Pages 一起提供）
highlighter: rouge

# 译稿集合：一篇文章的其他语言版本放在 _translations/ 里。
# 集合不是 site.posts，因此译文不会出现在列表页、分页和订阅源中，
# 首页每篇文章只出现一次，译文由文章页的语言切换器进入。
collections:
  translations:
    output: true

# 第三方插件（均为 GitHub Pages 官方白名单插件）
#   jekyll-feed     生成 Atom feed（/atom.xml）
#   jekyll-paginate 分页
#   jekyll-sitemap  生成 /sitemap.xml
plugins: [jekyll-feed, jekyll-paginate, jekyll-sitemap]

# Atom feed（由 jekyll-feed 生成）；RSS 2.0 的 /feed.xml 见根目录 feed.xml
feed:
  path: /atom.xml
  posts_limit: 20

# 评论（giscus，基于 GitHub Discussions）。
# 取值来自 https://giscus.app：repo_id / category_id 由该页面生成，
# repo_id 留空则整块评论区不渲染。
giscus:
  repo: huihao/huihao.github.io
  repo_id: "MDEwOlJlcG9zaXRvcnkzODU2NTA5MQ=="
  category: "Announcements"
  category_id: "DIC_kwDOAkx0484DK2yc"
  # pathname：按文章路径对应 Discussion；specific：按 data-term 对应
  mapping: "pathname"
  # preferred_color_scheme：跟随访客系统的明暗偏好（与站点自身的主题切换一致）
  theme: "preferred_color_scheme"
  lang: "zh-CN"

# 不发布这些文件（CNAME、node_modules 等是 GitHub Pages 的默认值，保留）
exclude:
  - CNAME
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache
  - src
  - scripts
  - package.json
  - package-lock.json
  - README.MD
  - Rakefile
  - .stylelintrc.json
  - .gitignore
